services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./app:/code/app
      - chroma_data:/code/chroma_data
      - document_data:/code/data
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

volumes:
  chroma_data:
  document_data:

# Phase 3+ adds a 'postgres' service for chat history and agent run logs.